name: Apply mobile UI patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-mobile-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ github.token }}

      - name: Apply mobile-only CSS patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          if "理由 01 / 路线卡" in html:
              print("Mobile UI patch already present.")
          else:
              marker = """      .poster-visual {
                display: none;
              }
"""
              patch = r'''      .section {
        padding: 50px 0;
      }

      .section-head {
        margin-bottom: 22px;
      }

      .lead {
        font-size: 15px;
        line-height: 1.6;
      }

      .reason-grid {
        gap: 16px;
      }

      .reason-card {
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 20px;
        border: 1px solid rgba(31, 41, 51, .12);
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(255, 255, 255, .96), rgba(255, 248, 232, .96));
        box-shadow: 0 14px 34px rgba(31, 41, 51, .09);
      }

      .reason-card h3 {
        order: 3;
        margin-bottom: 8px;
        font-size: 22px;
        line-height: 1.18;
      }

      .reason-card p {
        order: 4;
        font-size: 14px;
        line-height: 1.58;
      }

      .visual-label {
        order: 1;
        align-self: flex-start;
        margin-bottom: 14px;
        padding: 5px 10px;
        border: 1px solid rgba(31, 41, 51, .16);
        border-radius: 999px;
        background: var(--yellow);
        color: transparent;
        font-size: 0;
        box-shadow: none;
      }

      .visual-label:after {
        color: var(--dark);
        font-size: 12px;
        font-weight: 950;
      }

      .reason-grid .reason-card:nth-child(1) .visual-label:after {
        content: "理由 01 / 路线卡";
      }

      .reason-grid .reason-card:nth-child(2) .visual-label:after {
        content: "理由 02 / 水果梦";
      }

      .reason-grid .reason-card:nth-child(3) .visual-label:after {
        content: "理由 03 / 夜市牌";
      }

      .route-map,
      .fruit-lab,
      .open-sign {
        order: 2;
        margin: 0 0 18px;
        border-radius: 20px;
      }

      .route-map {
        height: 112px;
        display: grid;
        align-items: center;
        padding: 0 28px;
        border: 1px solid rgba(31, 41, 51, .1);
        background: rgba(74, 163, 255, .11);
      }

      .route-line {
        height: 6px;
      }

      .route-dot {
        width: 44px;
        height: 44px;
        border-width: 1px;
        font-size: 12px;
      }

      .ice-block {
        top: -23px;
        width: 32px;
        height: 32px;
        border-width: 1px;
      }

      .fruit-lab {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        padding: 12px;
        border: 1px solid rgba(31, 41, 51, .1);
        background: rgba(255, 209, 102, .16);
      }

      .fruit-item {
        min-height: 58px;
        border-width: 1px;
        border-radius: 16px;
        font-size: 14px;
      }

      .open-sign {
        overflow: hidden;
        border: 1px solid rgba(31, 41, 51, .14);
        box-shadow: none;
      }

      .sign-row {
        gap: 8px;
        padding: 11px 12px;
        font-size: 13px;
      }

      .sign-row b {
        font-size: 15px;
      }

      .scenario-grid {
        gap: 12px;
        margin-inline: -16px;
        padding: 4px 16px 12px;
      }

      .scenario-card {
        min-width: 74vw;
        padding: 20px;
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .06));
      }

      .scenario-icon {
        width: 66px;
        height: 66px;
        margin-bottom: 22px;
        border-radius: 20px;
        font-size: 24px;
      }

      .scenario-card h3 {
        margin-bottom: 8px;
        font-size: 25px;
      }

      .scenario-card p {
        display: -webkit-box;
        overflow: hidden;
        color: rgba(255, 255, 255, .7);
        font-size: 15px;
        line-height: 1.48;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .scenario-card .chips {
        gap: 7px;
        margin-top: 16px;
      }

      .chips span {
        padding: 6px 9px;
        font-size: 13px;
      }

      .scenario-section .container:after {
        content: "●  ○  ○  ○    左右滑动查看更多";
        display: block;
        margin-top: 6px;
        color: rgba(255, 255, 255, .66);
        font-size: 13px;
        font-weight: 850;
        text-align: center;
      }

      .temp-timeline {
        gap: 14px;
        margin-top: 22px;
        padding-left: 26px;
      }

      .temp-timeline:before {
        content: "";
        position: absolute;
        left: 7px;
        top: 24px;
        bottom: 24px;
        width: 3px;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--blue), var(--yellow), var(--orange));
      }

      .temp-step {
        padding: 18px;
        border-width: 1px;
        border-radius: 24px;
        box-shadow: 0 14px 34px rgba(255, 122, 26, .1);
      }

      .temp-step:before,
      .temp-step:first-child:before {
        display: block;
        left: -27px;
        top: 25px;
        bottom: auto;
        width: 13px;
        height: 13px;
        border: 3px solid var(--bg);
        border-radius: 50%;
        background: var(--orange);
        box-shadow: 0 0 0 2px rgba(255, 122, 26, .25);
      }

      .temp-degree {
        margin-bottom: 6px;
        font-size: 42px;
      }

      .temp-name {
        margin-bottom: 6px;
        font-size: 18px;
      }

      .temp-step p {
        font-size: 14px;
        line-height: 1.55;
      }

      .petition-section {
        padding: 54px 0 62px;
      }

      .petition-card {
        padding: 24px 20px;
        border-radius: 26px;
        box-shadow: 0 20px 58px rgba(0, 0, 0, .24);
      }

      .petition-card h2 {
        margin-bottom: 10px;
        text-align: center;
      }

      .petition-card .initiator {
        display: flex;
        width: fit-content;
        margin-inline: auto;
      }

      .petition-card p {
        font-size: 14px;
        line-height: 1.58;
        text-align: center;
      }

      .petition-count {
        display: block;
        margin: 22px 0 20px;
        padding: 18px;
        border: 1px solid rgba(255, 255, 255, .14);
        border-radius: 24px;
        background: rgba(255, 255, 255, .07);
        text-align: center;
      }

      .petition-count:before {
        content: "已有";
        display: block;
        color: rgba(255, 255, 255, .7);
        font-size: 14px;
        font-weight: 900;
      }

      .petition-count strong {
        display: block;
        margin: 4px 0;
        font-size: clamp(76px, 22vw, 108px);
      }

      .petition-count span {
        font-size: 0;
      }

      .petition-count span:after {
        content: "人加入东北30℃计划";
        color: rgba(255, 255, 255, .78);
        font-size: 15px;
        font-weight: 900;
      }

      .petition-card label {
        margin-bottom: 8px;
      }

      .petition-card input,
      .petition-card button {
        min-height: 52px;
      }

      .petition-card button {
        margin-top: 14px;
        font-size: 0;
      }

      .petition-card button:before {
        content: "签下这一票";
        font-size: 16px;
      }

      .petition-card:after {
        content: "愿雪少一点，烧烤摊多一点。";
        display: block;
        margin-top: 12px;
        color: rgba(255, 255, 255, .62);
        font-size: 13px;
        font-weight: 800;
        text-align: center;
      }

'''
              if marker not in html:
                  raise SystemExit("Mobile hero marker not found in index.html")
              html = html.replace(marker, patch + marker, 1)
              path.write_text(html, encoding="utf-8")
              print("Mobile UI patch inserted.")
          PY

      - name: Commit and push Pages update
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine mobile mid-page UI"
          git push origin gh-pages
